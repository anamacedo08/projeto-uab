{% extends "base.html" %}

{% block content %}
<h2>Relatório de Pedidos</h2>

<div class="row mt-4 g-4">
    <div class="col-md-3">
        <div class="card bg-primary text-white h-100 shadow border-0">
            <div class="card-body text-center d-flex flex-column justify-content-center">
                <h6 class="card-title text-uppercase opacity-75">Total Geral</h6>
                <p class="card-text display-3 fw-bold mb-0">{{ metricas.total }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card bg-warning text-dark h-100 shadow border-0">
            <div class="card-body text-center d-flex flex-column justify-content-center">
                <h6 class="card-title text-uppercase opacity-75">Aguardando</h6>
                <p class="card-text display-3 fw-bold mb-0">{{ metricas.pendentes }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card bg-info text-dark h-100 shadow border-0">
            <div class="card-body text-center d-flex flex-column justify-content-center">
                <h6 class="card-title text-uppercase opacity-75">Em Produção</h6>
                <p class="card-text display-3 fw-bold mb-0">{{ metricas.em_fabricacao }}</p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card bg-success text-white h-100 shadow border-0">
            <div class="card-body text-center d-flex flex-column justify-content-center">
                <h6 class="card-title text-uppercase opacity-75">Enviados</h6>
                <p class="card-text display-3 fw-bold mb-0">{{ metricas.enviados }}</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
