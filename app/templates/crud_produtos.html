{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-4">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Novo Produto</h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="nome_produto" class="form-label fw-bold">Nome do Produto</label>
                        <input type="text" id="nome_produto" name="nome" class="form-control" required placeholder="Ex: Vaso de Cerâmica">
                    </div>
                    <div class="mb-3">
                        <label for="descricao_produto" class="form-label fw-bold">Descrição Breve</label>
                        <textarea id="descricao_produto" name="descricao" class="form-control" rows="3" required placeholder="Descreva o produto..."></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="imagem_url" class="form-label fw-bold">URL da Imagem</label>
                        <input type="url" id="imagem_url" name="imagem_url" class="form-control" required placeholder="https://exemplo.com/imagem.jpg">
                    </div>
                    <button type="submit" class="btn btn-success w-100 fw-bold shadow-sm">Cadastrar Produto</button>
                </form>
            </div>
        </div>
    </div>
    
    <div class="col-md-8">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Vitrine de Produtos</h5>
                <span class="badge bg-secondary">{{ produtos|length }} itens</span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th style="width: 80px;">Imagem</th>
                                <th>Nome</th>
                                <th>Descrição</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for produto in produtos %}
                            <tr>
                                <td>
                                    <img src="{{ produto.imagem_url }}" class="rounded shadow-sm" width="60" height="60" style="object-fit: cover;" alt="{{ produto.nome }}">
                                </td>
                                <td class="fw-bold text-primary">{{ produto.nome }}</td>
                                <td><small class="text-muted">{{ produto.descricao }}</small></td>
                                <td class="text-center">
                                    <div class="d-flex justify-content-center gap-2">
                                        <button type="button" class="btn btn-sm btn-outline-primary shadow-sm px-3" data-bs-toggle="modal" data-bs-target="#editModal{{ produto.id }}">
                                            Editar
                                        </button>
                                        <form action="{{ url_for('admin.deletar_produto', produto_id=produto.id) }}" method="POST" onsubmit="return confirm('Deseja realmente excluir este produto?')">
                                            <button type="submit" class="btn btn-sm btn-outline-danger shadow-sm px-3">
                                                Excluir
                                            </button>
                                        </form>
                                    </div>

                                    <!-- Edit Modal -->
                                    <div class="modal fade" id="editModal{{ produto.id }}" tabindex="-1" aria-labelledby="editModalLabel{{ produto.id }}" aria-hidden="true">
                                        <div class="modal-dialog">
                                            <div class="modal-content text-start">
                                                <div class="modal-header">
                                                    <h5 class="modal-title" id="editModalLabel{{ produto.id }}">Editar Produto</h5>
                                                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                </div>
                                                <div class="modal-body">
                                                    <form action="{{ url_for('admin.editar_produto', produto_id=produto.id) }}" method="POST">
                                                        <div class="mb-3">
                                                            <label for="nome{{ produto.id }}" class="form-label fw-bold">Nome</label>
                                                            <input type="text" name="nome" class="form-control" id="nome{{ produto.id }}" value="{{ produto.nome }}" required>
                                                        </div>
                                                        <div class="mb-3">
                                                            <label for="descricao{{ produto.id }}" class="form-label fw-bold">Descrição</label>
                                                            <textarea name="descricao" class="form-control" id="descricao{{ produto.id }}" rows="3" required>{{ produto.descricao }}</textarea>
                                                        </div>
                                                        <div class="mb-3">
                                                            <label for="imagem_url{{ produto.id }}" class="form-label fw-bold">URL da Imagem</label>
                                                            <input type="url" name="imagem_url" class="form-control" id="imagem_url{{ produto.id }}" value="{{ produto.imagem_url }}" required>
                                                        </div>
                                                        <button type="submit" class="btn btn-primary w-100">Salvar Alterações</button>
                                                    </form>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </td>
                            </tr>
                            {% else %}
                            <tr>
                                <td colspan="4" class="text-center py-5 text-muted">
                                    <p class="mb-0">Nenhum produto cadastrado.</p>
                                </td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
